<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Etch-A-Sketch</title>
</head>

<body>
    <h1 class = "heading">Etch-A-Sketch</h1>

    <div class = "stuff">
        <div class="inputs">
            <input type="color">
            <div class="btns">
                <button class = "btn">Color</button>
                <button class = "btn">Rainbow</button>
                <button class = "btn">Erase</button>
                <button class = "btn">Clear</button>
            </div>
            <output id="output"></output>
            <input type="range" id="slidy" min="2" max="81" value="16">
        </div>

        <div class="grid">
                
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
